name: Build and publish Windows installer
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts=false --foreground-scripts
      - run: npm test
      - run: powershell -ExecutionPolicy Bypass -File .\scripts\Instalar-Dependencias.ps1
      - name: Build installer and update manifest
        run: npm run dist:win
      - name: Archive installer for testing
        uses: actions/upload-artifact@v4
        with:
          name: StoriesHunterREA-Windows-Installer
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
      - name: Publish installer to public updates repository
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.STORIES_HUNTER_RELEASE_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if (-not $env:GH_TOKEN) {
            throw "Configure repository secret STORIES_HUNTER_RELEASE_TOKEN with Contents: read/write access to StoriesHunter-Updates."
          }
          $target = "janoquadros2-debug/StoriesHunter-Updates"
          $assets = @(Get-ChildItem dist -File | Where-Object { $_.Extension -in @(".exe", ".yml", ".blockmap") } | ForEach-Object FullName)
          if (-not ($assets | Where-Object { $_ -like "*.exe" })) { throw "Installer .exe missing" }
          if (-not ($assets | Where-Object { $_ -like "*latest.yml" })) { throw "Updater manifest latest.yml missing" }
          gh release view $env:TAG_NAME --repo $target *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG_NAME @assets --repo $target --clobber
          } else {
            gh release create $env:TAG_NAME @assets --repo $target --title "Stories Hunter REA $env:TAG_NAME" --notes "Instalador Windows e arquivos de atualização automática."
          }
