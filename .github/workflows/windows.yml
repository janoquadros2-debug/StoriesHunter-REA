name: Build and publish Windows installer
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts=false --foreground-scripts
      - run: npm test
      - run: powershell -ExecutionPolicy Bypass -File .\scripts\Instalar-Dependencias.ps1
      - name: Build installer and update manifest
        run: npm run dist:win
      - name: Archive installer for testing
        uses: actions/upload-artifact@v4
        with:
          name: StoriesHunterREA-Windows-Installer
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
      - name: Publish tested version automatically
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.STORIES_HUNTER_RELEASE_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) { throw "Secret STORIES_HUNTER_RELEASE_TOKEN is not configured." }
          $target = "janoquadros2-debug/StoriesHunter-Updates"
          $version = node -p "require('./package.json').version"
          if ($LASTEXITCODE -ne 0 -or -not $version) { throw "Version missing in package.json" }
          $tag = "v$version"
          if ($env:GITHUB_REF -like "refs/tags/*" -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Git tag does not match package.json version ($tag)."
          }
          $assets = @(Get-ChildItem dist -File | Where-Object { $_.Name -eq "latest.yml" -or $_.Name -like "*.exe" -or $_.Name -like "*.blockmap" } | ForEach-Object FullName)
          if (-not ($assets | Where-Object { $_ -like "*.exe" })) { throw "Installer .exe missing" }
          if (-not ($assets | Where-Object { $_ -like "*latest.yml" })) { throw "Updater manifest latest.yml missing" }
          gh release view $tag --repo $target --json tagName --jq .tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists. No re-publish without a version bump."
          } else {
            gh release create $tag @assets --repo $target --title "Stories Hunter REA $tag" --notes "Atualização automática do Stories Hunter REA para Windows."
            if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
            Write-Host "Published $tag to $target."
          }
