name: Build and publish Windows installer
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts=false --foreground-scripts
      - run: npm test
      - run: powershell -ExecutionPolicy Bypass -File .\scripts\Instalar-Dependencias.ps1
      - name: Build installer and update manifest
        run: npm run dist:win
      - name: Archive installer for testing
        uses: actions/upload-artifact@v4
        with:
          name: StoriesHunterREA-Windows-Installer
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
